<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vladyslav Zribniak — antrenor de padel, București</title>
<meta name="description" content="Antrenamente de padel în București cu antrenor certificat: individual, în doi și în grup. Programează o lecție de probă.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta property="og:title" content="Vladyslav Zribniak — Padel Coach">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{
  --ink:#0B0D0A; --ink2:#11140D; --card:#15180F; --line:#23271F; --line2:#343A2C; --line3:#4A5140;
  --paper:#F2F1EA; --paper2:#E4E3D6; --muted:#A3A69A; --soft:#B7BAAE; --soft2:#C7C9BE;
  --acc:#D4FF3A; --glass:#7FA8C9;
  --display:'Unbounded',system-ui,sans-serif; --body:'Manrope',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
  --wrap:1240px; --pad:clamp(20px,4vw,48px);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--ink);color:var(--paper);font-family:var(--body);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer}
img{max-width:100%;display:block}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.wrap{max-width:var(--wrap);margin:0 auto;padding-left:var(--pad);padding-right:var(--pad)}
.acc{color:var(--acc)}
.label{margin:0 0 14px;font-family:var(--mono);font-size:13px;letter-spacing:.14em;color:var(--acc);text-transform:uppercase}
.h2{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(30px,4vw,56px);line-height:1.04;letter-spacing:-.02em}
.btn{display:inline-flex;align-items:center;gap:12px;min-height:52px;padding:14px 26px;border-radius:999px;font-weight:700;border:1.5px solid transparent;transition:transform .15s ease, background .15s ease}
.btn:hover{transform:translateY(-2px)}
.btn-acc{background:var(--acc);color:var(--ink)}
.btn-ghost{border-color:var(--line3);color:var(--paper)}
.btn-ghost:hover{border-color:var(--paper)}
.btn-dark{background:var(--ink);color:var(--paper)}
.btn-outline-dark{border-color:var(--ink);color:var(--ink)}
.arrow{width:20px;height:20px}
section{scroll-margin-top:80px}

/* NAV */
.nav{position:sticky;top:0;z-index:50;background:rgba(11,13,10,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:72px}
.logo{display:flex;align-items:center;gap:12px}
.ball{width:48px;height:48px;border-radius:50%;background:var(--acc);flex:none;display:flex;align-items:center;justify-content:center}
.logo b{font-family:var(--display);font-weight:700;font-size:15px;line-height:1.15;display:block}
.logo small{display:block;font-family:var(--display);font-weight:500;color:var(--muted);font-size:11px;letter-spacing:.16em}
.menu{display:flex;gap:26px;font-weight:600;font-size:15px}
.menu a:hover{color:var(--acc)}
.nav-right{display:flex;align-items:center;gap:12px}
.langs{display:flex;gap:2px;font-family:var(--mono);font-size:13px;border:1px solid var(--line2);border-radius:999px;padding:3px}
.langs button{background:none;border:0;color:var(--muted);padding:7px 10px;border-radius:999px;min-height:36px}
.langs button[aria-pressed="true"]{background:var(--paper);color:var(--ink)}
.nav .btn{min-height:44px;padding:10px 18px;font-size:15px}
.burger{display:none;background:none;border:1px solid var(--line2);color:var(--paper);width:44px;height:44px;border-radius:12px;align-items:center;justify-content:center}
@media (max-width:1060px){
  .menu{display:none}
  .burger{display:inline-flex}
  .menu.open{display:flex;flex-direction:column;position:absolute;top:72px;left:0;right:0;background:var(--ink);border-bottom:1px solid var(--line);padding:16px var(--pad) 24px;gap:4px;font-size:18px}
  .menu.open a{padding:12px 0;border-bottom:1px solid var(--line)}
}
@media (max-width:560px){ .nav .btn-acc{display:none} .logo b{font-size:13px} }

/* HERO */
.hero .wrap{display:grid;grid-template-columns:1.05fr 1fr;gap:56px;align-items:center;padding-top:clamp(48px,7vw,104px);padding-bottom:clamp(56px,7vw,96px)}
@media (max-width:900px){.hero .wrap{grid-template-columns:1fr}}
.pill{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--line2);border-radius:999px;padding:8px 16px 8px 10px;font-size:14px;font-weight:600;color:#D9DACF}
.pill i{width:10px;height:10px;border-radius:50%;background:var(--acc)}
.hero h1{margin:26px 0 22px;font-family:var(--display);font-weight:800;font-size:clamp(42px,6.2vw,90px);line-height:.98;letter-spacing:-.03em}
.hero h1 span{color:var(--acc)}
.hero p.lead{margin:0 0 30px;max-width:520px;font-size:clamp(17px,1.5vw,20px);color:var(--soft2)}
.ctas{display:flex;flex-wrap:wrap;gap:14px}
.hero .ctas .btn{min-height:58px;font-size:17px}
.meta{display:flex;flex-wrap:wrap;gap:8px 28px;margin-top:26px;font-family:var(--mono);font-size:14px;color:var(--muted)}
.court-wrap{position:relative;height:clamp(320px,40vw,520px);display:flex;align-items:center;justify-content:center}
.court-disc{position:absolute;width:78%;aspect-ratio:1;border-radius:50%;background:#13160F;border:1px solid var(--line)}
.court-3d{position:relative;width:92%;transform:perspective(1100px) rotateX(56deg) rotateZ(-24deg)}
.court-3d svg{width:100%;display:block;overflow:visible}
.flyball{position:absolute;top:18%;left:22%;width:34px;height:34px;border-radius:50%;background:var(--acc);box-shadow:0 18px 30px -8px rgba(212,255,58,.35);animation:bounce 2.4s ease-in-out infinite}
.flyball::after{content:"";position:absolute;inset:5px 11px;border-left:2px solid var(--ink);border-right:2px solid var(--ink);border-radius:50%;opacity:.55}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.shot{position:absolute;right:2%;bottom:8%;background:var(--paper);color:var(--ink);border-radius:16px;padding:14px 18px;font-size:13px;font-weight:600;line-height:1.35;transform:rotate(-3deg);max-width:220px}
.shot small{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--line3)}
.shot b{display:block;font-family:var(--display);font-size:18px}

/* MARQUEE */
.marquee{background:var(--acc);color:var(--ink);overflow:hidden;transform:rotate(-1.2deg);margin:0 -40px;border-block:1px solid var(--ink)}
.marquee .track{display:flex;width:max-content;animation:mq 30s linear infinite;font-family:var(--display);font-weight:700;font-size:clamp(18px,2vw,26px);padding:16px 0;white-space:nowrap}
.marquee span{padding:0 26px}
@keyframes mq{to{transform:translateX(-50%)}}

/* WHY */
.sec{padding-top:clamp(64px,8vw,120px);padding-bottom:clamp(32px,4vw,56px)}
.sec-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:44px}
.sec-head p{margin:0;max-width:380px;color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:24px;overflow:hidden}
@media (max-width:900px){.facts{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.facts{grid-template-columns:1fr}}
.fact{background:var(--ink);padding:32px 28px;display:flex;flex-direction:column;gap:10px}
.fact .big{font-family:var(--display);font-weight:800;font-size:42px;color:var(--acc);line-height:1}
.fact b{font-weight:700}
.fact span{color:var(--muted);font-size:15px}

/* WHO */
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
@media (max-width:1000px){.grid4{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.grid4{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:30px;display:flex;flex-direction:column;gap:14px}
.card .num{font-family:var(--mono);color:var(--muted);font-size:14px}
.card h3{margin:0;font-family:var(--display);font-weight:700;font-size:22px;line-height:1.15}
.card p{margin:0;color:var(--soft)}

/* PICKER */
.picker{border:1px solid var(--line2);border-radius:32px;padding:clamp(24px,4vw,56px);display:grid;grid-template-columns:1fr 1fr;gap:40px;background:var(--ink2)}
@media (max-width:900px){.picker{grid-template-columns:1fr}}
.levels{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.chip-row{width:100%;text-align:left;font-weight:600;padding:16px 20px;border-radius:16px;min-height:56px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:transparent;color:var(--paper);border:1.5px solid var(--line2);transition:border-color .15s}
.chip-row:hover{border-color:var(--line3)}
.chip-row small{font-family:var(--mono);font-size:12px;opacity:.75}
.chip-row[aria-pressed="true"]{background:var(--acc);color:var(--ink);border-color:var(--acc)}
.rec{background:var(--paper);color:var(--ink);border-radius:24px;padding:clamp(26px,3vw,40px);display:flex;flex-direction:column;justify-content:space-between;gap:24px}
.rec small{font-family:var(--mono);font-size:13px;letter-spacing:.12em;color:var(--line3)}
.rec h3{margin:14px 0;font-family:var(--display);font-weight:800;font-size:clamp(24px,2.4vw,32px);line-height:1.1}
.rec p{margin:0 0 16px;color:#2E3328}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tags span{background:var(--ink);color:var(--paper);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600}

/* ABOUT */
.about{display:grid;grid-template-columns:1fr 1.1fr;gap:clamp(32px,5vw,72px);align-items:center}
@media (max-width:900px){.about{grid-template-columns:1fr}}
.photo{position:relative}
.photo .ph{aspect-ratio:4/5;border-radius:32px;background:repeating-linear-gradient(135deg,#15180F 0 14px,#1A1E14 14px 28px);border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;text-align:center;padding:32px;color:var(--muted);font-family:var(--mono);font-size:14px}
.cert{position:absolute;left:-12px;bottom:28px;background:var(--acc);color:var(--ink);border-radius:18px;padding:16px 20px;display:flex;align-items:center;gap:14px;transform:rotate(-2deg);max-width:300px;font-weight:700;font-size:15px;line-height:1.3}
.cert span{font-weight:500}
.about .big-p{font-size:19px;color:#D9DACF;margin:22px 0 14px}
.about .p{color:var(--muted);margin:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;border-top:1px solid var(--line2);padding-top:24px;margin-top:28px}
@media (max-width:520px){.stats{grid-template-columns:1fr 1fr}}
.stats b{display:block;font-family:var(--display);font-size:20px}
.stats span{color:var(--muted);font-size:14px}

/* PRICES */
.light{background:var(--paper);color:var(--ink)}
.light .sec-head p{color:#3D4335}
.price-card{background:#fff;border:1px solid #D9D8CC;border-radius:24px;padding:30px 26px;display:flex;flex-direction:column;gap:16px;position:relative}
.price-card .tag{font-family:var(--mono);font-size:13px;letter-spacing:.12em;color:var(--line3)}
.price-card h3{margin:0;font-family:var(--display);font-weight:700;font-size:24px}
.price-card p{margin:0;color:#3D4335;font-size:15px}
.price{margin-top:auto;display:flex;flex-direction:column;gap:4px}
.price .amt{font-family:var(--display);font-weight:800;font-size:clamp(28px,2.6vw,34px);line-height:1.05}
.price .amt em{font-style:normal;font-family:var(--body);font-weight:600;font-size:14px;color:var(--line3);margin-left:6px}
.price .sub{font-family:var(--mono);font-size:12.5px;color:#4A5140}
.price-card.dark{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.price-card.dark .tag{color:var(--muted)}
.price-card.dark p{color:var(--soft2)}
.price-card.dark .amt{color:var(--acc)}
.price-card.dark .amt em,.price-card.dark .sub{color:var(--muted)}
.badge{position:absolute;top:-14px;right:22px;background:var(--acc);color:var(--ink);font-weight:700;font-size:13px;padding:6px 12px;border-radius:999px}
.trial{margin-top:24px;background:var(--paper2);border-radius:20px;padding:20px 26px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px}
.trial b{font-size:18px}
.trial .sub{font-family:var(--mono);font-size:12.5px;color:#4A5140;display:block;font-weight:500}
.rate-note{margin:18px 0 0;font-family:var(--mono);font-size:12.5px;color:#4A5140}

/* STEPS */
.steps{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line2)}
@media (max-width:900px){.steps{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.steps{grid-template-columns:1fr}}
.step{padding:28px 24px 28px 0;display:flex;flex-direction:column;gap:12px;border-bottom:1px solid var(--line)}
.step .n{font-family:var(--display);font-weight:800;font-size:56px;line-height:1;color:transparent;-webkit-text-stroke:1.5px var(--acc)}
.step h3{margin:0;font-size:20px}
.step p{margin:0;color:var(--muted);font-size:15px}

/* BLOG CARDS */
.posts{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
@media (max-width:900px){.posts{grid-template-columns:repeat(3,minmax(270px,1fr));overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px}
  .posts>*{scroll-snap-align:start}}
.post{display:flex;flex-direction:column;gap:14px;color:var(--paper);border-radius:24px}
.post:hover h3{color:var(--acc)}
.cover{position:relative;aspect-ratio:16/10;border-radius:22px;overflow:hidden;background:var(--card);border:1px solid var(--line)}
.cover svg{position:absolute;inset:0;width:100%;height:100%}
.cover .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:50%;background:var(--acc);color:var(--ink);display:flex;align-items:center;justify-content:center}
.post .cat{font-family:var(--mono);font-size:12px;letter-spacing:.14em;color:var(--acc)}
.post .row{display:flex;justify-content:space-between;gap:12px;align-items:center}
.post .time{font-family:var(--mono);font-size:12px;color:var(--muted)}
.post h3{margin:0;font-family:var(--display);font-weight:700;font-size:20px;line-height:1.2;transition:color .15s}
.post p{margin:0;color:var(--muted);font-size:15px}

/* FAQ */
.faq-grid{display:grid;grid-template-columns:1fr 1.4fr;gap:40px}
@media (max-width:900px){.faq-grid{grid-template-columns:1fr}}
.faq{border-top:1px solid var(--line2)}
.faq-item{border-bottom:1px solid var(--line2)}
.faq-q{width:100%;background:none;border:0;color:var(--paper);font-weight:700;font-size:18px;text-align:left;padding:22px 0;min-height:56px;display:flex;justify-content:space-between;align-items:center;gap:16px}
.faq-q i{flex:none;width:32px;height:32px;border-radius:50%;border:1.5px solid var(--line3);display:flex;align-items:center;justify-content:center;font-style:normal;font-family:var(--mono);color:var(--acc)}
.faq-a{margin:0;padding:0 48px 24px 0;color:var(--soft)}

/* BOOKING */
.booking{background:var(--acc);color:var(--ink)}
.booking .wrap{display:grid;grid-template-columns:1fr 1fr;gap:48px;padding-top:clamp(64px,8vw,120px);padding-bottom:clamp(64px,8vw,120px)}
@media (max-width:900px){.booking .wrap{grid-template-columns:1fr}}
.booking h2{margin:0 0 22px;font-family:var(--display);font-weight:800;font-size:clamp(40px,5.6vw,80px);line-height:.96;letter-spacing:-.03em}
.booking .lead{font-size:19px;max-width:440px;color:#1F2418;margin:0 0 24px}
.socials{display:flex;flex-wrap:wrap;gap:10px}
.form{background:var(--ink);color:var(--paper);border-radius:28px;padding:clamp(24px,3vw,40px);display:flex;flex-direction:column;gap:20px}
.field{display:flex;flex-direction:column;gap:8px}
.field label,.field .lbl{font-size:14px;font-weight:600;color:var(--soft2)}
.field input{font:inherit;background:var(--card);color:var(--paper);border:1.5px solid var(--line2);border-radius:14px;padding:14px 16px;min-height:52px}
.field input::placeholder{color:#7D8174}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-weight:600;font-size:15px;padding:10px 16px;min-height:44px;border-radius:999px;background:transparent;color:var(--paper);border:1.5px solid var(--line2)}
.chip[aria-pressed="true"]{background:var(--acc);color:var(--ink);border-color:var(--acc)}
.submit{font-weight:800;font-size:17px;background:var(--acc);color:var(--ink);border:0;border-radius:999px;padding:18px 24px;min-height:58px}
.consent{margin:0;font-size:13px;color:var(--muted)}
.thanks{display:flex;flex-direction:column;gap:16px;align-items:flex-start;padding:24px 0}
.thanks .ok{width:56px;height:56px;border-radius:50%;background:var(--acc);color:var(--ink);display:flex;align-items:center;justify-content:center}
.thanks h3{margin:0;font-family:var(--display);font-weight:800;font-size:28px}
.thanks p{margin:0;color:var(--soft2)}
.thanks .btn-ghost{background:transparent;color:var(--paper);border-color:var(--line3)}

/* FOOTER */
footer .cols{display:grid;grid-template-columns:repeat(3,1fr);gap:32px;padding:clamp(56px,7vw,96px) 0 48px;border-bottom:1px solid var(--line)}
@media (max-width:760px){footer .cols{grid-template-columns:1fr}}
footer .col{display:flex;flex-direction:column;gap:8px}
footer .k{font-family:var(--mono);font-size:12px;letter-spacing:.14em;color:var(--muted)}
footer .v{font-weight:700;font-size:18px}
footer .s{color:var(--soft)}
footer a.link{color:var(--acc);font-weight:600}
footer .bottom{padding:40px 0;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:24px}
footer .word{font-family:var(--display);font-weight:800;font-size:clamp(48px,10vw,150px);line-height:.85;letter-spacing:-.04em;color:#1C2117}
footer .copy{color:#8E9185;font-size:14px}

/* BLOG PAGE */
.page-top{padding-top:clamp(40px,6vw,80px);padding-bottom:32px}
.back{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-weight:600;margin-bottom:28px;min-height:44px}
.back:hover{color:var(--acc)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-top:28px}
.feature{display:grid;grid-template-columns:1.3fr 1fr;gap:32px;align-items:center;margin-bottom:48px}
@media (max-width:900px){.feature{grid-template-columns:1fr}}
.feature h3{font-size:clamp(24px,3vw,38px)}
.blog-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:28px 20px}
@media (max-width:900px){.blog-grid{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.blog-grid{grid-template-columns:1fr}}
.empty{color:var(--muted);padding:40px 0}

/* ARTICLE */
.art-head{padding-top:clamp(40px,6vw,80px);padding-bottom:clamp(40px,5vw,64px)}
.art-head .cat{font-family:var(--mono);font-size:13px;letter-spacing:.14em;color:var(--acc)}
.art-head h1{margin:16px 0 18px;font-family:var(--display);font-weight:800;font-size:clamp(32px,5vw,64px);line-height:1.02;letter-spacing:-.025em;max-width:900px}
.art-head .info{font-family:var(--mono);font-size:13px;color:var(--muted);display:flex;gap:20px;flex-wrap:wrap}
.art-cover{max-width:980px;margin:0 auto -80px;position:relative;z-index:1;padding:0 var(--pad)}
.art-cover .cover{aspect-ratio:16/8;border-radius:28px}
.art-body{background:var(--paper);color:var(--ink);padding:clamp(120px,12vw,150px) var(--pad) clamp(56px,7vw,96px)}
.prose{max-width:680px;margin:0 auto;font-size:18.5px;line-height:1.7}
.prose p{margin:0 0 20px;color:#22261C}
.prose h3{font-family:var(--display);font-weight:700;font-size:24px;margin:40px 0 14px;line-height:1.2}
.prose strong{color:var(--ink)}
.prose .tip{background:var(--ink);color:var(--paper);border-radius:18px;padding:20px 24px;margin:28px 0;border:0;font-size:17px}
.prose .tip b{color:var(--acc)}
.prose .video{aspect-ratio:9/16;max-width:320px;margin:0 auto 32px;border-radius:24px;background:var(--ink);color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px;font-family:var(--mono);font-size:13px}
.art-cta{max-width:680px;margin:48px auto 0;background:var(--acc);border-radius:24px;padding:28px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:16px}
.art-cta b{font-family:var(--display);font-size:20px;line-height:1.2;max-width:360px}
.related{padding-top:clamp(56px,7vw,96px);padding-bottom:clamp(40px,5vw,64px)}

[hidden]{display:none!important}
.photo .ph img{width:100%;height:100%;object-fit:cover;border-radius:32px}
.photo .ph.has-img{padding:0}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.prose .video-embed{aspect-ratio:9/16;max-width:340px;margin:0 auto 32px;border-radius:24px;overflow:hidden;background:var(--ink)}
.prose .video-embed iframe{width:100%;height:100%;border:0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>
</head>
<body>

<header class="nav">
  <div class="wrap">
    <a href="#top" class="logo" aria-label="Padel coach">
      <span class="ball" aria-hidden="true"><svg viewBox="0 0 240 240" width="36" height="36"><path d="M96 200 V40 H136 A44 44 0 0 1 136 128 H96" fill="none" stroke="#0B0D0A" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/><path d="M170 24 L134 200 H204" fill="none" stroke="#D4FF3A" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/><path d="M170 24 L134 200 H204" fill="none" stroke="#0B0D0A" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/><path d="M150 42 A44 44 0 0 1 178 70" fill="none" stroke="#D4FF3A" stroke-width="40"/><path d="M136 40 A44 44 0 0 1 180 84" fill="none" stroke="#0B0D0A" stroke-width="20" stroke-linecap="round"/></svg></span>
      <span><b data-t="coachName"></b><small>PADEL COACH</small></span>
    </a>
    <nav class="menu" id="menu" aria-label="Menu">
      <a href="#about" data-t="nav.about"></a>
      <a href="#formats" data-t="nav.formats"></a>
      <a href="#first" data-t="nav.first"></a>
      <a href="#/blog" data-t="nav.blog"></a>
      <a href="#faq" data-t="nav.faq"></a>
      <a href="#contact" data-t="nav.contact"></a>
    </nav>
    <div class="nav-right">
      <div class="langs" role="group" aria-label="Language">
        <button type="button" data-lang="ro">RO</button>
        <button type="button" data-lang="en">EN</button>
        <button type="button" data-lang="uk">UA</button>
      </div>
      <a href="#booking" class="btn btn-acc" data-t="nav.book"></a>
      <button type="button" class="burger" id="burger" aria-label="Menu" aria-expanded="false">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>
  </div>
</header>

<!-- ================= HOME ================= -->
<main id="view-home" class="view">

<section class="hero" id="top">
  <div class="wrap">
    <div>
      <span class="pill"><i aria-hidden="true"></i><span data-t="hero.badge"></span></span>
      <h1 data-t="hero.h1"></h1>
      <p class="lead" data-t="hero.lead"></p>
      <div class="ctas">
        <a href="#booking" class="btn btn-acc"><span data-t="hero.cta1"></span><svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
        <a href="#formats" class="btn btn-ghost" data-t="nav.formats"></a>
      </div>
      <div class="meta"><span data-t="hero.meta1"></span><span data-t="hero.meta2"></span></div>
    </div>
    <div class="court-wrap" aria-hidden="true">
      <div class="court-disc"></div>
      <div class="court-3d">
        <svg viewBox="0 0 400 200">
          <rect x="0" y="0" width="400" height="200" rx="3" fill="#1C2117"/>
          <rect x="0" y="0" width="400" height="200" rx="3" fill="none" stroke="#F2F1EA" stroke-opacity=".85" stroke-width="2.5"/>
          <line x1="61" y1="0" x2="61" y2="200" stroke="#F2F1EA" stroke-opacity=".7" stroke-width="2"/>
          <line x1="339" y1="0" x2="339" y2="200" stroke="#F2F1EA" stroke-opacity=".7" stroke-width="2"/>
          <line x1="61" y1="100" x2="339" y2="100" stroke="#F2F1EA" stroke-opacity=".7" stroke-width="2"/>
          <line x1="200" y1="-6" x2="200" y2="206" stroke="#F2F1EA" stroke-width="4"/>
          <g stroke="#7FA8C9" stroke-opacity=".55" stroke-width="5">
            <line x1="-3" y1="0" x2="-3" y2="200"/><line x1="403" y1="0" x2="403" y2="200"/>
            <line x1="0" y1="-3" x2="80" y2="-3"/><line x1="320" y1="-3" x2="400" y2="-3"/>
            <line x1="0" y1="203" x2="80" y2="203"/><line x1="320" y1="203" x2="400" y2="203"/>
          </g>
          <path d="M 330 150 Q 250 20 120 70 Q 40 100 8 40" fill="none" stroke="#D4FF3A" stroke-width="2.5" stroke-dasharray="6 7" stroke-linecap="round"/>
          <circle cx="330" cy="150" r="7" fill="none" stroke="#F2F1EA" stroke-opacity=".6" stroke-width="2"/>
          <circle cx="8" cy="40" r="5" fill="#D4FF3A" fill-opacity=".5"/>
        </svg>
      </div>
      <div class="flyball"></div>
      <div class="shot"><small data-t="shot.k"></small><b data-t="shot.name"></b><span data-t="shot.desc"></span></div>
    </div>
  </div>
</section>

<div class="marquee" aria-hidden="true"><div class="track" id="marquee"></div></div>

<section class="wrap sec">
  <div class="sec-head">
    <h2 class="h2" style="max-width:720px" data-t="why.h2"></h2>
    <p data-t="why.p"></p>
  </div>
  <div class="facts" id="facts"></div>
</section>

<section class="wrap sec">
  <p class="label" data-t="who.label"></p>
  <div class="grid4" id="who"></div>
</section>

<section class="wrap sec">
  <div class="picker">
    <div>
      <p class="label" data-t="picker.label"></p>
      <h2 class="h2" style="font-size:clamp(28px,3.2vw,44px)" data-t="picker.h2"></h2>
      <div class="levels" id="levels" role="group"></div>
    </div>
    <div class="rec" aria-live="polite">
      <div>
        <small data-t="rec.label"></small>
        <h3 id="rec-title"></h3>
        <p id="rec-text"></p>
        <div class="tags" id="rec-tags"></div>
      </div>
      <a href="#booking" class="btn btn-dark" style="align-self:flex-start"><span data-t="rec.cta"></span><svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
    </div>
  </div>
</section>

<section class="wrap sec" id="about">
  <div class="about">
    <div class="photo">
      <div class="ph" id="coach-photo"></div>
      <div class="cert">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="9" r="6"/><path d="M8.5 14.2L7 22l5-3 5 3-1.5-7.8"/></svg>
        <div data-t="about.cert"></div>
      </div>
    </div>
    <div>
      <p class="label" data-t="about.label"></p>
      <h2 class="h2" data-t="about.h2"></h2>
      <p class="big-p" data-t="about.p1"></p>
      <p class="p" data-t="about.p2"></p>
      <div class="stats" id="stats"></div>
    </div>
  </div>
</section>

<section class="light" id="formats">
  <div class="wrap sec" style="padding-bottom:clamp(64px,8vw,120px)">
    <div class="sec-head">
      <h2 class="h2" data-t="nav.formats"></h2>
      <p data-t="formats.p"></p>
    </div>
    <div class="grid4" id="prices"></div>
    <div class="trial">
      <div><b data-t="trial.t"></b> <b id="trial-amt"></b><span class="sub" id="trial-sub"></span></div>
      <a href="#booking" class="btn btn-dark" data-t="nav.book"></a>
    </div>
    <p class="rate-note" id="rate-note"></p>
  </div>
</section>

<section class="wrap sec" id="first">
  <p class="label" data-t="nav.first"></p>
  <h2 class="h2" style="max-width:760px;margin-bottom:44px" data-t="first.h2"></h2>
  <div class="steps" id="steps"></div>
</section>

<section class="wrap sec" id="tips">
  <div class="sec-head">
    <div><p class="label" data-t="tips.label"></p><h2 class="h2" style="max-width:720px" data-t="tips.h2"></h2></div>
    <a href="#/blog" class="btn btn-ghost" data-t="tips.all"></a>
  </div>
  <div class="posts" id="tips-list"></div>
</section>

<section class="wrap sec" id="faq" style="padding-bottom:clamp(64px,8vw,120px)">
  <div class="faq-grid">
    <div>
      <p class="label" data-t="nav.faq"></p>
      <h2 class="h2" data-t="faq.h2"></h2>
      <p style="color:var(--muted);margin-top:16px" data-t="faq.p"></p>
    </div>
    <div class="faq" id="faq-list"></div>
  </div>
</section>

<section class="booking" id="booking">
  <div class="wrap">
    <div>
      <h2 data-t="book.h2"></h2>
      <p class="lead" data-t="book.p"></p>
      <div class="socials">
        <a href="#" class="btn btn-dark" id="s-wa" target="_blank" rel="noopener">WhatsApp</a>
        <a href="#" class="btn btn-dark" id="s-tg" target="_blank" rel="noopener">Telegram</a>
        <a href="#" class="btn btn-outline-dark" id="s-ig" target="_blank" rel="noopener">Instagram</a>
      </div>
    </div>
    <div class="form" id="form">
      <div id="form-fields" style="display:flex;flex-direction:column;gap:20px">
        <div class="field"><label for="f-name" data-t="form.name"></label><input id="f-name" type="text" autocomplete="name"></div>
        <div class="field"><label for="f-contact" data-t="form.contact"></label><input id="f-contact" type="text" autocomplete="tel" placeholder="+40 … / @username"></div>
        <div style="position:absolute;left:-9999px" aria-hidden="true"><label for="f-website">Website</label><input id="f-website" type="text" tabindex="-1" autocomplete="off"></div>
        <p id="form-error" role="alert" style="margin:0;color:#FF8A6B;font-weight:600" hidden></p>
        <div class="field"><span class="lbl" data-t="form.format"></span><div class="chips" id="chips-format" role="group"></div></div>
        <div class="field"><span class="lbl" data-t="form.time"></span><div class="chips" id="chips-time" role="group"></div></div>
        <button type="button" class="submit" id="submit" data-t="form.submit"></button>
        <p class="consent" data-t="form.consent"></p>
      </div>
      <div class="thanks" id="thanks" hidden>
        <span class="ok" aria-hidden="true"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
        <h3 data-t="form.thanksH"></h3>
        <p data-t="form.thanksP"></p>
        <button type="button" class="btn btn-ghost" id="again" data-t="form.again"></button>
      </div>
    </div>
  </div>
</section>
</main>

<!-- ================= BLOG LIST ================= -->
<main id="view-blog" class="view" hidden>
  <section class="wrap page-top">
    <a href="#top" class="back" data-t="blog.home"></a>
    <p class="label" data-t="tips.label"></p>
    <h1 class="h2" style="font-size:clamp(36px,5.4vw,76px);max-width:900px" data-t="blog.h1"></h1>
    <div class="filters" id="filters" role="group"></div>
  </section>
  <section class="wrap" style="padding-bottom:clamp(64px,8vw,120px)">
    <div id="feature"></div>
    <div class="blog-grid" id="blog-grid"></div>
  </section>
</main>

<!-- ================= ARTICLE ================= -->
<main id="view-post" class="view" hidden>
  <section class="wrap art-head">
    <a href="#/blog" class="back" data-t="post.back"></a>
    <div class="cat" id="post-cat"></div>
    <h1 id="post-title"></h1>
    <div class="info" id="post-info"></div>
  </section>
  <div class="art-cover" id="post-cover"></div>
  <article class="art-body">
    <div class="prose" id="post-body"></div>
    <div class="art-cta">
      <b data-t="post.cta"></b>
      <a href="#booking" class="btn btn-dark" data-t="form.submit"></a>
    </div>
  </article>
  <section class="wrap related">
    <p class="label" data-t="post.related"></p>
    <div class="posts" id="related"></div>
  </section>
</main>

<footer id="contact">
  <div class="wrap">
    <div class="cols">
      <div class="col"><span class="k" data-t="foot.where"></span><span class="v" data-t="foot.club"></span><span class="s" data-t="foot.addr"></span><a href="#" class="link" id="c-map" target="_blank" rel="noopener" data-t="foot.map"></a></div>
      <div class="col"><span class="k" data-t="foot.contact"></span><a href="#" class="v" id="c-phone"></a><a href="#" class="s" id="c-tg" target="_blank" rel="noopener"></a><a href="#" class="s" id="c-ig" target="_blank" rel="noopener"></a></div>
      <div class="col"><span class="k" data-t="foot.sched"></span><span class="v" data-t="foot.s1"></span><span class="s" data-t="foot.s2"></span></div>
    </div>
    <div class="bottom"><span class="word" aria-hidden="true">PADEL</span><span class="copy" data-t="foot.copy"></span></div>
  </div>
</footer>

<script src="/content-defaults.js"></script>
<script src="/app.js"></script>
</body>
</html>
